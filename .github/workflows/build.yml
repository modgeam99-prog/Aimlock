name: Build SO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Android SDK
        run: |
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          cd /opt/android-sdk/cmdline-tools
          sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          sudo unzip -q cmdline-tools.zip
          sudo mv cmdline-tools latest
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
      - name: Install NDK
        run: |
          yes | sudo /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "ndk;21.4.7075529" > /dev/null
          echo "NDK=/opt/android-sdk/ndk/21.4.7075529" >> $GITHUB_ENV
      - name: Build arm64
        run: |
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang++ \
            -shared -O3 -fPIC -std=c++17 \
            -o libaimlock-arm64.so aimlock.cpp \
            -landroid -llog -lmediandk
      - name: Build armv7
        run: |
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi23-clang++ \
            -shared -O3 -fPIC -std=c++17 \
            -o libaimlock-armv7.so aimlock.cpp \
            -landroid -llog -lmediandk
      - uses: actions/upload-artifact@v4
        with:
          name: aimlock-so
          path: |
            libaimlock-arm64.so
            libaimlock-armv7.so
