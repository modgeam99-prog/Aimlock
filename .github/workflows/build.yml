name: Build SO
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update -y && sudo apt-get install -y unzip wget
      - name: Download NDK r25c
        run: |
          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          mv android-ndk-r25c ndk
          echo "NDK=$HOME/ndk" >> $GITHUB_ENV
      - name: Verify NDK
        run: |
          ls $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/ | head -20
      - name: Build arm64
        run: |
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ \
            -shared -O3 -fPIC -std=c++17 \
            -o libaimlock-arm64.so aimlock.cpp \
            -landroid -llog -lmediandk
      - name: Build armv7
        run: |
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++ \
            -shared -O3 -fPIC -std=c++17 \
            -o libaimlock-armv7.so aimlock.cpp \
            -landroid -llog -lmediandk
      - name: List output
        run: ls -la *.so
      - uses: actions/upload-artifact@v4
        with:
          name: aimlock-so
          path: |
            libaimlock-arm64.so
            libaimlock-armv7.so
